<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>树木病虫害放行工作台</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><header><div class="brand">林务 · 放行台</div><div class="status">审计账本在线 <span></span></div></header><main><section class="hero"><div><p class="eyebrow">城市绿化样本治理</p><h1>从现场样本到<br><em>可验证放行</em></h1><p class="lead">把采集、鉴定、整改与复核串成一条可追溯的工作链。</p></div><div class="hero-mark">TREE<br><small>TRACE / 01</small></div></section><section class="workspace"><div class="panel list-panel"><div class="panel-head"><div><span class="eyebrow">批次目录</span><h2>工作中的样本</h2></div><button id="refresh" class="icon-button" title="刷新批次">↻</button></div><div id="batch-list" class="batch-list"></div></div><div class="panel detail-panel"><div class="panel-head"><div><span class="eyebrow">当前批次</span><h2 id="detail-title">选择一个批次</h2></div><span id="detail-status" class="pill">未选择</span></div><div id="detail" class="detail-empty">从左侧选择批次，或新建一个现场采集批次。</div></div></section><section class="panel create-panel"><div class="panel-head"><div><span class="eyebrow">新建记录</span><h2>登记采集任务</h2></div></div><form id="create-form"><input name="location" placeholder="采集地点" required><input name="collectionWindow" placeholder="采集时间窗" required><input name="species" placeholder="树种" required><input name="suspectedIssue" placeholder="疑似病虫害"><input name="collector" placeholder="采集员" required><select name="role"><option value="collector">采集员</option><option value="管理员">管理员</option></select><button type="submit">建立批次 <span>→</span></button></form></section></main><script src="/static/app.js"></script></body></html>
